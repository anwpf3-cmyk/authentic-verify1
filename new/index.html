<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новый чат</title>
  <link id="favicon" rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAOklEQVR4nGNgGAWjgPpg165d/1H569evJ14NxGsASQYgawBJA0gxgGQDyDaAZAPIaQDpBpDUgFEAAwCTuQ1X520n1wAAAABJRU5ErkJggg==" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Тёплая графитово-серая тёмная тема */
      --bg-main: #1C1B19;
      --bg-sidebar: #161513;
      --bg-input: #252421;
      --bg-hover: #2E2C29;
      --bg-msg-user: #2F2D2A;
      --border-subtle: #33312E;
      --border-focus: #4B4843;
      --text-primary: #ECEAE6;
      --text-secondary: #98938B;
      --send-btn-bg: #F4F2EE;
      --send-btn-color: #161513;
      --shadow-input: 0 8px 24px rgba(0, 0, 0, 0.16);
      --sb-width: 240px;
    }

    /* Тёплая лаконичная светло-серая тема (не белая) */
    body.light-theme {
      --bg-main: #D7D4CE;
      --bg-sidebar: #CDC9C2;
      --bg-input: #DFDCD6;
      --bg-hover: #C2BEB6;
      --bg-msg-user: #C7C3BB;
      --border-subtle: #B8B4AC;
      --border-focus: #9E9A92;
      --text-primary: #22201D;
      --text-secondary: #635F58;
      --send-btn-bg: #22201D;
      --send-btn-color: #ECEAE6;
      --shadow-input: 0 6px 20px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      position: relative;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.resizing {
      user-select: none;
      cursor: ew-resize;
    }

    /* Кнопка-символ "l l" в левом верхнем углу без какого-либо выделения */
    .sidebar-trigger {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 3px;
      padding-left: 3px;
      user-select: none;
      background: transparent !important;
      outline: none !important;
      box-shadow: none !important;
      border: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    .sidebar-trigger:hover,
    .sidebar-trigger:active,
    .sidebar-trigger:focus,
    .sidebar-trigger.pinned {
      background: transparent !important;
      color: var(--text-secondary);
      outline: none !important;
      box-shadow: none !important;
    }

    .hover-edge-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 14px;
      height: 100vh;
      z-index: 90;
    }

    /* Выдвижная боковая панель строго без тени, только тонкая полосочка границы */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sb-width);
      height: 100vh;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      box-shadow: none !important;
      padding: 18px 14px 14px 14px;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease, border-color 0.25s ease;
      z-index: 95;
    }

    body.resizing .sidebar {
      transition: none;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    /* Полоска для изменения ширины панели */
    .resize-handle {
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: ew-resize;
      display: none;
      z-index: 105;
    }

    body.sidebar-pinned .resize-handle {
      display: block;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      padding-left: 40px;
      height: 28px;
      margin-bottom: 18px;
      overflow: hidden;
      white-space: nowrap;
    }

    .brand-title {
      font-family: 'Lora', Georgia, serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    /* Кнопка "Новый чат" с прозрачной окантовкой */
    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: background-color 0.15s ease;
    }

    .new-chat-btn:hover {
      background-color: var(--bg-hover);
    }

    /* Нижний футер панели с миниатюрной кнопкой темы */
    .sidebar-footer {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 12px;
    }

    .theme-toggle-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .theme-toggle-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    .theme-toggle-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Основная рабочая область */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: margin-left 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      width: 100%;
      height: 100vh;
    }

    body.resizing .main-container {
      transition: none;
    }

    body.sidebar-pinned .main-container {
      margin-left: var(--sb-width);
    }

    .center-wrapper {
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.25s ease;
    }

    .main-container.chat-started {
      justify-content: flex-end;
      padding-top: 56px;
      padding-bottom: 18px;
    }

    .main-container.chat-started .center-wrapper {
      height: 100%;
      justify-content: space-between;
    }

    /* Блок приветствия */
    .greeting-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      text-align: center;
    }

    /* Белый неоновый "+" (сохраняет неоново-белое свечение в обеих темах) */
    .neon-plus {
      font-size: 28px;
      font-weight: 400;
      color: #FFFFFF;
      line-height: 1;
      user-select: none;
      text-shadow:
        0 0 6px rgba(255, 255, 255, 1),
        0 0 14px rgba(255, 255, 255, 0.9),
        0 0 26px rgba(255, 255, 255, 0.75);
      animation: pulseGlow 3.2s infinite alternate ease-in-out;
    }

    body.light-theme .neon-plus {
      text-shadow:
        0 0 4px rgba(255, 255, 255, 1),
        0 0 12px rgba(255, 255, 255, 0.95),
        0 0 22px rgba(160, 155, 148, 0.85);
    }

    @keyframes pulseGlow {
      from {
        text-shadow:
          0 0 5px rgba(255, 255, 255, 0.9),
          0 0 12px rgba(255, 255, 255, 0.75),
          0 0 22px rgba(255, 255, 255, 0.5);
      }
      to {
        text-shadow:
          0 0 8px rgba(255, 255, 255, 1),
          0 0 18px rgba(255, 255, 255, 0.95),
          0 0 32px rgba(255, 255, 255, 0.75);
      }
    }

    .greeting-text {
      font-family: 'Lora', Georgia, serif;
      font-size: 27px;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    /* Область сообщений */
    .messages-area {
      display: none;
      width: 100%;
      flex: 1;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 16px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .messages-area.active {
      display: flex;
    }

    .msg {
      font-size: 15px;
      line-height: 1.6;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      padding: 11px 16px;
      border-radius: 14px;
      background-color: var(--bg-msg-user);
      color: var(--text-primary);
    }

    /* Прозрачный баббл ассистента без окантовки */
    .msg.ai {
      align-self: flex-start;
      padding: 4px 2px;
      background: transparent !important;
      border: none !important;
      color: var(--text-primary);
    }

    .char-fade {
      display: inline;
      animation: charAppear 0.18s ease-out forwards;
    }

    @keyframes charAppear {
      from {
        opacity: 0;
        filter: blur(1px);
      }
      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    /* Поле ввода */
    .prompt-container {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 14px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-input);
      transition: border-color 0.2s ease, background-color 0.25s ease, padding 0.2s ease;
    }

    .prompt-container:focus-within {
      border-color: var(--border-focus);
    }

    .main-container.chat-started .prompt-container {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      padding: 8px 10px;
      border-radius: 14px;
      gap: 8px;
    }

    .attached-files {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .attached-files.has-files {
      display: flex;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-hover);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .file-chip button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .prompt-textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      min-height: 44px;
      max-height: 200px;
    }

    .main-container.chat-started .prompt-textarea {
      flex: 1;
      width: auto;
      min-height: 24px;
      max-height: 140px;
      order: 2;
      padding: 4px 2px;
    }

    .prompt-textarea::placeholder {
      color: var(--text-secondary);
    }

    .prompt-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .main-container.chat-started .prompt-bottom-bar {
      display: contents;
    }

    .attach-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 22px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .main-container.chat-started .attach-btn {
      order: 1;
    }

    .attach-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    .send-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: var(--send-btn-bg);
      border: none;
      color: var(--send-btn-color);
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding-top: 4px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .send-btn.visible {
      display: flex;
    }

    .main-container.chat-started .send-btn {
      order: 3;
      margin-left: 0;
    }

    .send-btn:active {
      transform: scale(0.94);
    }

    @media (max-width: 640px) {
      .greeting-text {
        font-size: 21px;
      }
      body.sidebar-pinned .main-container {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

        </svg>

  <main class="main-container" id="mainContainer">

      <div class="greeting-box" id="greetingBox">

      <div class="messages-area" id="messagesArea"></div>

      <div class="prompt-container" id="promptContainer">
        <div class="attached-files" id="attachedFiles"></div>

        <textarea
          class="prompt-textarea"
          id="promptInput"
          placeholder="Чем я могу помочь сегодня?"

        <div class="prompt-bottom-bar">
          <input type="file" id="fileInput" multiple hidden />
          <button type="button" class="attach-btn" id="attachBtn" title="Прикрепить файлы">+</button>
          <button type="button" class="send-btn" id="sendBtn" title="Отправить">^</button>

  </main>

  <script>
    // 1. Попиксельная генерация точного логотипа вкладки 16x16 (идентично соседней вкладке)
    (function generateExactFavicon() {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 16, 16);
      ctx.fillStyle = '#E8EAED';
      // Вертикальная перекладина 10px высотой, 2px толщиной, строго по центру (x: 7..8, y: 3..12)
      ctx.fillRect(7, 3, 2, 10);
      // Горизонтальная перекладина 10px шириной, 2px толщиной, строго по центру (x: 3..12, y: 7..8)
      ctx.fillRect(3, 7, 10, 2);

      const link = document.getElementById('favicon');

        link.href = canvas.toDataURL('image/png');
      }
    })();

        "Добрый вечер, время спокойного и глубокого фокуса!",
        "В тихом свете луны легко рождаются решения.",
        "Вечерняя тишина бережет твою концентрацию."
      ],
      22: [
        "Поздний вечер располагает к вдумчивой работе.",
        "Теплый свет лампы помогает навести порядок в мыслях.",
        "Доброго вечера и вдохновения для важных строк!"
      ],
      23: [
        "На исходе суток рождаются самые точные идеи.",
        "Звездный час для тех, кто увлечен своим делом.",
        "Тихий привет в завершении дня — я готов помочь!"
      ]
    };

    function setRandomGreeting() {
      const currentHour = new Date().getHours();
      const phrases = greetingsByHour[currentHour] || greetingsByHour[12];
      const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
      document.getElementById('greetingText').textContent = randomPhrase;
    }

    setRandomGreeting();

    // 3. Переключатель темы
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const iconSun = document.getElementById('iconSun');
    const iconMoon = document.getElementById('iconMoon');

    function applyTheme(isLight) {
      if (isLight) {
        document.body.classList.add('light-theme');
        iconSun.style.display = 'none';
        iconMoon.style.display = 'block';
      } else {
        document.body.classList.remove('light-theme');
        iconSun.style.display = 'block';
        iconMoon.style.display = 'none';
      }
    }

    if (localStorage.getItem('xenon_theme') === 'light') {
      applyTheme(true);
    }

    themeToggleBtn.addEventListener('click', () => {
      const isLightNow = !document.body.classList.contains('light-theme');
      applyTheme(isLightNow);
      localStorage.setItem('xenon_theme', isLightNow ? 'light' : 'dark');
    });

    // 4. Логика выдвижной и регулируемой боковой панели (10% - 20%, порог закрытия 50% от минимума)
    const sidebar = document.getElementById('sidebar');
    const trigger = document.getElementById('sidebarTrigger');
    const hoverEdge = document.getElementById('hoverEdge');
    const resizeHandle = document.getElementById('resizeHandle');
    let isPinned = false;
    let isResizing = false;

    function applySidebarWidth(px) {
      document.documentElement.style.setProperty('--sb-width', px + 'px');
    }

    function getClampedWidth(rawPx) {
      const vw = window.innerWidth;
      const minW = Math.max(130, vw * 0.10);
      const maxW = Math.max(minW + 40, vw * 0.20);
      return Math.min(Math.max(rawPx, minW), maxW);
    }

    const savedWidthPct = parseFloat(localStorage.getItem('xenon_sb_pct'));
    if (!isNaN(savedWidthPct)) {
      applySidebarWidth(getClampedWidth(window.innerWidth * savedWidthPct));
    } else {
      applySidebarWidth(getClampedWidth(window.innerWidth * 0.15));
    }

    window.addEventListener('resize', () => {
      const currentPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sb-width'));
      if (!isNaN(currentPx)) {
        applySidebarWidth(getClampedWidth(currentPx));
      }
    });

    function openSidebar() {
      sidebar.classList.add('open');
    }

    function closeSidebar() {
      if (!isPinned && !isResizing) {
        sidebar.classList.remove('open');
      }
    }

    function unpinAndCloseSidebar() {
      isPinned = false;
      sidebar.classList.remove('open');
      trigger.classList.remove('pinned');
      document.body.classList.remove('sidebar-pinned');
    }

    trigger.addEventListener('mouseenter', openSidebar);
    hoverEdge.addEventListener('mouseenter', openSidebar);
    sidebar.addEventListener('mouseleave', closeSidebar);

    trigger.addEventListener('click', () => {
      isPinned = !isPinned;
      if (isPinned) {
        const currentPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sb-width'));
        applySidebarWidth(getClampedWidth(currentPx));
        sidebar.classList.add('open');
        trigger.classList.add('pinned');
        document.body.classList.add('sidebar-pinned');
      } else {
        unpinAndCloseSidebar();
      }
    });

    resizeHandle.addEventListener('mousedown', (e) => {
      if (!isPinned) return;
      e.preventDefault();
      isResizing = true;
      document.body.classList.add('resizing');
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const vw = window.innerWidth;
      const minW = vw * 0.10;
      const maxW = vw * 0.20;
      const closeThreshold = minW * 0.50; // 50% от минимальной ширины (5% ширины окна)

      if (e.clientX < closeThreshold) {
        isResizing = false;
        document.body.classList.remove('resizing');
        unpinAndCloseSidebar();
        applySidebarWidth(minW);
        return;
      }

      const clamped = Math.min(Math.max(e.clientX, minW), maxW);
      applySidebarWidth(clamped);
      localStorage.setItem('xenon_sb_pct', (clamped / vw).toFixed(4));
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        document.body.classList.remove('resizing');
      }
    });

    // 5. Управление видимостью кнопки "^" и прикреплением файлов
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const attachedFilesBox = document.getElementById('attachedFiles');
    let selectedFiles = [];

    function updateSendButtonVisibility() {
      const hasText = promptInput.value.length > 0;
      const hasFiles = selectedFiles.length > 0;
      sendBtn.classList.toggle('visible', hasText || hasFiles);
    }

    attachBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      selectedFiles = selectedFiles.concat(files);
      renderFiles();
      updateSendButtonVisibility();
      fileInput.value = '';
    });

    function renderFiles() {
      attachedFilesBox.innerHTML = '';
      attachedFilesBox.classList.toggle('has-files', selectedFiles.length > 0);
      selectedFiles.forEach((file, index) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `
          <span>${file.name}</span>
          <button type="button">&times;</button>
        `;
        chip.querySelector('button').addEventListener('click', () => {
          selectedFiles.splice(index, 1);
          renderFiles();
          updateSendButtonVisibility();
        });
        attachedFilesBox.appendChild(chip);
      });
    }

    // 6. Авто-высота поля, отправка и посимвольная печать ответа
    const mainContainer = document.getElementById('mainContainer');
    const messagesArea = document.getElementById('messagesArea');
    const greetingBox = document.getElementById('greetingBox');
    const newChatBtn = document.getElementById('newChatBtn');
    let activeTypingTimer = null;

    promptInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      updateSendButtonVisibility();
    });

    function typeTextSmoothly(element, fullText) {
      if (activeTypingTimer) {
        clearInterval(activeTypingTimer);
      }
      let index = 0;
      activeTypingTimer = setInterval(() => {
        if (index < fullText.length) {
          const span = document.createElement('span');
          span.className = 'char-fade';
          span.textContent = fullText[index];
          element.appendChild(span);
          index++;
          messagesArea.scrollTop = messagesArea.scrollHeight;
        } else {
          clearInterval(activeTypingTimer);
          activeTypingTimer = null;
        }
      }, 16);
    }

    function handleSend() {
      const text = promptInput.value;
      if (!text.trim() && selectedFiles.length === 0) return;

      greetingBox.style.display = 'none';
      messagesArea.classList.add('active');
      mainContainer.classList.add('chat-started');

      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      const fileNames = selectedFiles.length
        ? `
[Файлы: ${selectedFiles.map(f => f.name).join(', ')}]`
        : '';
      userMsg.textContent = text.trim() + fileNames;
      messagesArea.appendChild(userMsg);

      const aiMsg = document.createElement('div');
      aiMsg.className = 'msg ai';
      messagesArea.appendChild(aiMsg);
      messagesArea.scrollTop = messagesArea.scrollHeight;

      typeTextSmoothly(aiMsg, 'Интерфейс готов к работе. Подключите API-ключ для запуска агентов.');

      promptInput.value = '';
      promptInput.style.height = 'auto';
      selectedFiles = [];
      renderFiles();
      updateSendButtonVisibility();
    }

    sendBtn.addEventListener('click', handleSend);

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    newChatBtn.addEventListener('click', () => {
      if (activeTypingTimer) {
        clearInterval(activeTypingTimer);
        activeTypingTimer = null;
      }
      messagesArea.innerHTML = '';
      messagesArea.classList.remove('active');
      mainContainer.classList.remove('chat-started');
      greetingBox.style.display = 'flex';
      promptInput.value = '';
      promptInput.style.height = 'auto';
      selectedFiles = [];
      renderFiles();
      updateSendButtonVisibility();
      setRandomGreeting();
    });
  </script>
</body>
</html>
