<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новый чат</title>
  <link id="faviconLink" rel="icon" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #18191B;
      --bg-sidebar: #131416;
      --bg-input: #222428;
      --bg-hover: #2A2D32;
      --bg-msg-user: #2B2E34;
      --border-subtle: #2E3136;
      --border-focus: #454952;
      --text-primary: #ECECEE;
      --text-secondary: #8E929B;
      --send-btn-bg: #FFFFFF;
      --send-btn-color: #000000;
      --shadow-input: 0 8px 24px rgba(0, 0, 0, 0.2);
      --sidebar-width: 240px;
    }

    body.light-theme {
      --bg-main: #E2E4E8;
      --bg-sidebar: #D6D9DF;
      --bg-input: #ECEEF1;
      --bg-hover: #C9CDD4;
      --bg-msg-user: #D2D5DC;
      --border-subtle: #C2C6CE;
      --border-focus: #A6ACB8;
      --text-primary: #1F2227;
      --text-secondary: #5F6572;
      --send-btn-bg: #FFFFFF;
      --send-btn-color: #000000;
      --shadow-input: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      position: relative;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.is-resizing,
    body.is-resizing * {
      user-select: none !important;
      cursor: ew-resize !important;
    }

    body.is-resizing .sidebar,
    body.is-resizing .main-container {
      transition: none !important;
    }

    .sidebar-trigger {
      position: fixed;
      top: 16px;
      left: 16px;
      height: 32px;
      padding: 0 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 2px;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .sidebar-trigger:hover,
    .sidebar-trigger.pinned {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    .hover-edge-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 14px;
      height: 100vh;
      z-index: 90;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      padding: 18px 12px 14px 12px;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease, border-color 0.25s ease;
      z-index: 95;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.22);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-resizer {
      position: absolute;
      top: 0;
      right: -4px;
      width: 8px;
      height: 100%;
      cursor: ew-resize;
      display: none;
      z-index: 105;
    }

    body.sidebar-pinned .sidebar-resizer {
      display: block;
    }

    .sidebar-resizer::after {
      content: "";
      position: absolute;
      top: 0;
      left: 3px;
      width: 2px;
      height: 100%;
      background-color: transparent;
      transition: background-color 0.15s ease;
    }

    .sidebar-resizer:hover::after,
    body.is-resizing .sidebar-resizer::after {
      background-color: var(--border-focus);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      padding-left: 44px;
      height: 28px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .brand-title {
      font-family: 'Lora', Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: background-color 0.15s ease;
    }

    .new-chat-btn:hover {
      background-color: var(--bg-hover);
    }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 12px;
    }

    .theme-toggle-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .theme-toggle-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    .theme-toggle-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: margin-left 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      width: 100%;
      height: 100vh;
    }

    body.sidebar-pinned .main-container {
      margin-left: var(--sidebar-width);
    }

    .center-wrapper {
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.25s ease;
    }

    .main-container.chat-started {
      justify-content: flex-end;
      padding-top: 56px;
      padding-bottom: 18px;
    }

    .main-container.chat-started .center-wrapper {
      height: 100%;
      justify-content: space-between;
    }

    .greeting-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      text-align: center;
    }

    .neon-plus {
      font-size: 28px;
      font-weight: 400;
      color: #FFFFFF;
      line-height: 1;
      user-select: none;
      text-shadow:
        0 0 6px rgba(255, 255, 255, 1),
        0 0 14px rgba(255, 255, 255, 0.9),
        0 0 26px rgba(255, 255, 255, 0.75);
      animation: pulseGlow 3.2s infinite alternate ease-in-out;
    }

    body.light-theme .neon-plus {
      text-shadow:
        0 0 4px rgba(255, 255, 255, 1),
        0 0 12px rgba(255, 255, 255, 0.95),
        0 0 22px rgba(180, 190, 210, 0.85);
    }

    @keyframes pulseGlow {
      from {
        text-shadow:
          0 0 5px rgba(255, 255, 255, 0.9),
          0 0 12px rgba(255, 255, 255, 0.75),
          0 0 22px rgba(255, 255, 255, 0.5);
      }
      to {
        text-shadow:
          0 0 8px rgba(255, 255, 255, 1),
          0 0 18px rgba(255, 255, 255, 0.95),
          0 0 32px rgba(255, 255, 255, 0.75);
      }
    }

    .greeting-text {
      font-family: 'Lora', Georgia, serif;
      font-size: 27px;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .messages-area {
      display: none;
      width: 100%;
      flex: 1;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 16px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .messages-area.active {
      display: flex;
    }

    .msg {
      font-size: 15px;
      line-height: 1.6;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      padding: 11px 16px;
      border-radius: 12px;
      background-color: var(--bg-msg-user);
      color: var(--text-primary);
    }

    /* Прозрачный баббл без рамки и без окантовки для ответов Ксенона */
    .msg.ai {
      align-self: flex-start;
      padding: 4px 2px;
      background-color: transparent;
      border: none;
      color: var(--text-primary);
      max-width: 92%;
    }

    /* Плавное проявление каждой напечатанной буквы */
    .typed-char {
      display: inline;
      animation: charFadeIn 0.22s ease-out forwards;
    }

    @keyframes charFadeIn {
      from {
        opacity: 0;
        filter: blur(1.5px);
      }
      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    .prompt-container {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 14px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-input);
      transition: border-color 0.2s ease, background-color 0.25s ease, padding 0.2s ease;
    }

    .prompt-container:focus-within {
      border-color: var(--border-focus);
    }

    .main-container.chat-started .prompt-container {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      padding: 8px 10px 8px 10px;
      border-radius: 14px;
      gap: 8px;
    }

    .attached-files {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .attached-files.has-files {
      display: flex;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-hover);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .file-chip button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .prompt-textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      min-height: 44px;
      max-height: 200px;
    }

    .main-container.chat-started .prompt-textarea {
      flex: 1;
      width: auto;
      min-height: 24px;
      max-height: 140px;
      order: 2;
      padding: 4px 2px;
    }

    .prompt-textarea::placeholder {
      color: var(--text-secondary);
    }

    .prompt-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .main-container.chat-started .prompt-bottom-bar {
      display: contents;
    }

    .attach-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 22px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .main-container.chat-started .attach-btn {
      order: 1;
    }

    .attach-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    .send-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: var(--send-btn-bg);
      border: none;
      color: var(--send-btn-color);
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding-top: 4px;
      flex-shrink: 0;
      margin-left: auto;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.88);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s ease;
    }

    .send-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .main-container.chat-started .send-btn {
      order: 3;
      margin-left: 0;
    }

    .send-btn:active {
      transform: scale(0.94);
    }

    @media (max-width: 640px) {
      .greeting-text {
        font-size: 21px;
      }
      body.sidebar-pinned .main-container {
        margin-left: 0;
      }
    }
  </style>
</head>

  <script>
    // Генерация точной растровой иконки вкладки (16x16 и 32x32) 1-в-1 как на странице верификации
    (function generateExactFavicon() {
      const size = 32;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, size, size);
      ctx.fillStyle = '#E8EAED';

      // Точные геометрические пропорции крестика: компактный размер внутри 32x32,
      // четкие прямые перекладины толщиной 4px и длиной 16px, строго по пиксельной сетке
      const armLength = 16;
      const thickness = 4;
      const offset = (size - armLength) / 2;   // 8
      const centerPos = (size - thickness) / 2; // 14

      // Вертикальная перекладина
      ctx.fillRect(centerPos, offset, thickness, armLength);
      // Горизонтальная перекладина
      ctx.fillRect(offset, centerPos, armLength, thickness);

      const pngUrl = canvas.toDataURL('image/png');
      const link = document.getElementById('faviconLink');
      if (link) {
        link.href = pngUrl;
      }
    })();

        "Доброго вечера и вдохновения для важных строк!"
      ],
      23: [
        "На исходе суток рождаются самые точные идеи.",
        "Звездный час для тех, кто увлечен своим делом.",
        "Тихий привет в завершении дня — я готов помочь!"
      ]
    };

    function setRandomGreeting() {
      const currentHour = new Date().getHours();
      const phrases = greetingsByHour[currentHour] || greetingsByHour[12];
      const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
      document.getElementById('greetingText').textContent = randomPhrase;
    }

    setRandomGreeting();

    // Переключатель темы
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const iconSun = document.getElementById('iconSun');
    const iconMoon = document.getElementById('iconMoon');

    function applyTheme(isLight) {
      if (isLight) {
        document.body.classList.add('light-theme');
        iconSun.style.display = 'none';
        iconMoon.style.display = 'block';
      } else {
        document.body.classList.remove('light-theme');
        iconSun.style.display = 'block';
        iconMoon.style.display = 'none';
      }
    }

    if (localStorage.getItem('xenon_theme') === 'light') {
      applyTheme(true);
    }

    themeToggleBtn.addEventListener('click', () => {
      const isLightNow = !document.body.classList.contains('light-theme');
      applyTheme(isLightNow);
      localStorage.setItem('xenon_theme', isLightNow ? 'light' : 'dark');
    });

    // Логика боковой панели и регулировки ширины (10% - 20%)
    const sidebar = document.getElementById('sidebar');
    const trigger = document.getElementById('sidebarTrigger');
    const hoverEdge = document.getElementById('hoverEdge');
    const resizer = document.getElementById('sidebarResizer');

    let isPinned = false;
    let isResizing = false;
    let savedWidthPercent = parseFloat(localStorage.getItem('xenon_sidebar_pct')) || 15;

    function clampSidebarPercent(pct) {
      return Math.min(20, Math.max(10, pct));
    }

    function applySidebarWidth(pct) {
      const clamped = clampSidebarPercent(pct);
      const pxWidth = Math.round((window.innerWidth * clamped) / 100);
      document.documentElement.style.setProperty('--sidebar-width', pxWidth + 'px');
      return clamped;
    }

    savedWidthPercent = applySidebarWidth(savedWidthPercent);

    window.addEventListener('resize', () => {
      applySidebarWidth(savedWidthPercent);
    });

    function openSidebar() {
      applySidebarWidth(savedWidthPercent);
      sidebar.classList.add('open');
    }

    function closeSidebar() {
      if (!isPinned && !isResizing) {
        sidebar.classList.remove('open');
      }
    }

    function unpinAndCloseSidebar() {
      isPinned = false;
      isResizing = false;
      document.body.classList.remove('is-resizing');
      document.body.classList.remove('sidebar-pinned');
      trigger.classList.remove('pinned');
      sidebar.classList.remove('open');
    }

    trigger.addEventListener('mouseenter', openSidebar);
    hoverEdge.addEventListener('mouseenter', openSidebar);
    sidebar.addEventListener('mouseleave', closeSidebar);

    trigger.addEventListener('click', () => {
      isPinned = !isPinned;
      if (isPinned) {
        applySidebarWidth(savedWidthPercent);
        sidebar.classList.add('open');
        trigger.classList.add('pinned');
        document.body.classList.add('sidebar-pinned');
      } else {
        unpinAndCloseSidebar();
      }
    });

    // Перетягивание правого края зафиксированной панели
    resizer.addEventListener('mousedown', (e) => {
      if (!isPinned) return;
      e.preventDefault();
      isResizing = true;
      document.body.classList.add('is-resizing');
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;

      const currentPercent = (e.clientX / window.innerWidth) * 100;

      // Порог закрытия: 50% от минимальной ширины (10% * 0.5 = 5% ширины окна)
      if (currentPercent <= 5) {
        unpinAndCloseSidebar();
        return;
      }

      savedWidthPercent = applySidebarWidth(currentPercent);
      localStorage.setItem('xenon_sidebar_pct', savedWidthPercent.toFixed(2));
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        document.body.classList.remove('is-resizing');
      }
    });

    // Управление видимостью кнопки "^"
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    let selectedFiles = [];

    function updateSendButtonVisibility() {
      const hasText = promptInput.value.length > 0;
      const hasFiles = selectedFiles.length > 0;
      if (hasText || hasFiles) {
        sendBtn.classList.add('visible');
      } else {
        sendBtn.classList.remove('visible');
      }
    }

    // Прикрепление файлов
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const attachedFilesBox = document.getElementById('attachedFiles');

    attachBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      selectedFiles = selectedFiles.concat(files);
      renderFiles();
      updateSendButtonVisibility();
      fileInput.value = '';
    });

    function renderFiles() {
      attachedFilesBox.innerHTML = '';
      if (selectedFiles.length === 0) {
        attachedFilesBox.classList.remove('has-files');
        return;
      }
      attachedFilesBox.classList.add('has-files');
      selectedFiles.forEach((file, index) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `
          <span>${file.name}</span>
          <button type="button">&times;</button>
        `;
        chip.querySelector('button').addEventListener('click', () => {
          selectedFiles.splice(index, 1);
          renderFiles();
          updateSendButtonVisibility();
        });
        attachedFilesBox.appendChild(chip);
      });
    }

    // Плавная посимвольная печать ответа Ксенона
    const mainContainer = document.getElementById('mainContainer');
    const messagesArea = document.getElementById('messagesArea');
    const greetingBox = document.getElementById('greetingBox');
    const newChatBtn = document.getElementById('newChatBtn');
    let activeTypingTimers = [];

    function typeMessageSmoothly(container, fullText) {
      let index = 0;
      const chars = Array.from(fullText);

      const timer = setInterval(() => {
        if (index >= chars.length) {
          clearInterval(timer);
          return;
        }
        const span = document.createElement('span');
        span.className = 'typed-char';
        span.textContent = chars[index];
        container.appendChild(span);
        index++;
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }, 16);

      activeTypingTimers.push(timer);
    }

    promptInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      updateSendButtonVisibility();
    });

    function handleSend() {
      const text = promptInput.value;
      if (!text.trim() && selectedFiles.length === 0) return;

      greetingBox.style.display = 'none';
      messagesArea.classList.add('active');
      mainContainer.classList.add('chat-started');

      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      const fileNames = selectedFiles.length
        ? `
[Файлы: ${selectedFiles.map(f => f.name).join(', ')}]`
        : '';
      userMsg.textContent = text.trim() + fileNames;
      messagesArea.appendChild(userMsg);

      const aiMsg = document.createElement('div');
      aiMsg.className = 'msg ai';
      messagesArea.appendChild(aiMsg);

      messagesArea.scrollTop = messagesArea.scrollHeight;

      const replyText = 'Интерфейс готов к работе. Подключите API-ключ для запуска агентов.';
      typeMessageSmoothly(aiMsg, replyText);

      promptInput.value = '';
      promptInput.style.height = 'auto';
      selectedFiles = [];
      renderFiles();
      updateSendButtonVisibility();
    }

    sendBtn.addEventListener('click', handleSend);

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    newChatBtn.addEventListener('click', () => {
      activeTypingTimers.forEach(t => clearInterval(t));
      activeTypingTimers = [];
      messagesArea.innerHTML = '';
      messagesArea.classList.remove('active');
      mainContainer.classList.remove('chat-started');
      greetingBox.style.display = 'flex';
      promptInput.value = '';
      promptInput.style.height = 'auto';
      selectedFiles = [];
      renderFiles();
      updateSendButtonVisibility();
      setRandomGreeting();
    });
  </script>
</body>
</html>
