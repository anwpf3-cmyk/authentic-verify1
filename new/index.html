<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ксенон</title>
<link id="fav1" rel="shortcut icon" type="image/png">
<link id="fav2" rel="icon" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<script>
(function(){
  var c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#E8EAED';
  ctx.fillRect(7, 3, 2, 10);
  ctx.fillRect(3, 7, 10, 2);
  var url = c.toDataURL('image/png');
  document.getElementById('fav1').href = url;
  document.getElementById('fav2').href = url;
})();
</script>
<style>
:root {
  --bg: #121110;
  --sb: #0D0C0B;
  --inp: #1A1917;
  --hov: #242220;
  --umsg: #22201E;
  --brd: #292724;
  --fbrd: #3E3B36;
  --txt: #F0EDE6;
  --sub: #8A867E;
  --sbg: #F0EDE6;
  --scol: #121110;
  --art-bg: #161513;
}

body.light {
  --bg: #EAE8E4;
  --sb: #E0DDD7;
  --inp: #F4F3F0;
  --hov: #D5D1C9;
  --umsg: #DCD8D0;
  --brd: #CFCBC2;
  --fbrd: #B5B0A5;
  --txt: #1A1917;
  --sub: #6B675E;
  --sbg: #1A1917;
  --scol: #F4F3F0;
  --art-bg: #F2F0EC;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--txt);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  transition: background 0.2s ease, color 0.2s ease;
}

body.resizing {
  user-select: none;
  cursor: col-resize;
}

body.resizing iframe {
  pointer-events: none;
}

.trig {
  position: fixed;
  top: 16px;
  left: 16px;
  width: 34px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  color: var(--sub);
  font-size: 19px;
  font-weight: 300;
  letter-spacing: -0.04em;
  user-select: none;
  background: transparent !important;
  border: none !important;
}

/* Кнопка открытия панели артефакта в правом верхнем углу (квадратик с закрашенной правой половиной) */
.art-trig {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 34px;
  height: 32px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  color: var(--sub);
  background: transparent;
  border: none;
  border-radius: 7px;
  transition: color 0.15s ease, background 0.15s ease;
}

.art-trig.vis {
  display: flex;
}

.art-trig:hover {
  color: var(--txt);
  background: var(--hov);
}

.sb {
  position: fixed;
  top: 0;
  left: 0;
  width: 240px;
  height: 100vh;
  background: var(--sb);
  border-right: 1px solid var(--brd);
  padding: 18px 14px 14px;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, border-color 0.2s ease;
  z-index: 95;
}

.sb.no-trans { transition: none !important; }
.sb.open { transform: translateX(0); }

.resizer {
  display: none;
  position: absolute;
  top: 0;
  right: -4px;
  width: 8px;
  height: 100%;
  cursor: col-resize;
  z-index: 105;
}

body.pinned .resizer { display: block; }

.sb-head {
  display: flex;
  align-items: center;
  padding-left: 44px;
  height: 28px;
  margin-bottom: 18px;
  overflow: hidden;
  white-space: nowrap;
}

.brand {
  font-family: 'Lora', Georgia, serif;
  font-size: 19px;
  font-weight: 500;
  color: var(--txt);
}

.new-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--txt);
  font-size: 13.5px;
  cursor: pointer;
  transition: background 0.15s ease;
  overflow: hidden;
  white-space: nowrap;
}

.new-btn:hover { background: var(--hov); }

.ad-box {
  margin-top: auto;
  margin-bottom: 12px;
  padding: 10px;
  border: 1px dashed var(--brd);
  border-radius: 10px;
  font-size: 11px;
  color: var(--sub);
  text-align: center;
  line-height: 1.4;
}

.sb-foot {
  display: flex;
  justify-content: flex-end;
}

.thm-btn {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: transparent;
  border: none;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.thm-btn:hover { background: var(--hov); color: var(--txt); }
.thm-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Контейнер рабочей области */
.workspace {
  flex: 1;
  display: flex;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  transition: margin-left 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}

.workspace.no-trans { transition: none !important; }

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 25vh 24px 24px;
  height: 100vh;
  min-width: 280px;
  overflow: hidden;
  transition: padding 0.25s ease;
}

.wrap {
  width: 100%;
  max-width: 740px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.main.started {
  justify-content: flex-end;
  padding-top: 54px;
  padding-bottom: 18px;
}

.main.started .wrap {
  height: 100%;
  justify-content: space-between;
}

.greet {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 26px;
  text-align: center;
}

.plus-neon {
  font-size: 28px;
  color: #FFFFFF;
  line-height: 1;
  user-select: none;
  text-shadow:
    0 0 6px #FFFFFF,
    0 0 14px rgba(255, 255, 255, 0.9),
    0 0 26px rgba(255, 255, 255, 0.7);
}

body.light .plus-neon {
  text-shadow:
    0 0 3px #FFFFFF,
    0 0 10px #FFFFFF,
    0 0 18px rgba(130, 125, 115, 0.75);
}

.greet-txt {
  font-family: 'Lora', Georgia, serif;
  font-size: 27px;
  font-weight: 400;
  color: var(--txt);
  line-height: 1.3;
}

/* Сообщения */
.msgs {
  display: none;
  width: 100%;
  flex: 1;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 14px;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 6px;
}

.msgs.active { display: flex; }

.msg {
  font-size: 14.5px;
  line-height: 1.65;
  max-width: 88%;
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}

.msg.user {
  align-self: flex-end;
  background: var(--umsg);
  padding: 10px 15px;
  border-radius: 12px;
}

.msg.ai {
  align-self: flex-start;
  background: transparent;
  border: none;
  padding: 4px 2px;
  color: var(--txt);
  width: 100%;
}

.thinking-pulse {
  color: var(--sub);
  font-size: 13.5px;
  font-style: italic;
}

/* Баббл-карточка артефакта в чате */
.art-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 12px 0 4px;
  padding: 12px 14px;
  background: var(--inp);
  border: 1px solid var(--brd);
  border-radius: 12px;
  max-width: 380px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
  user-select: none;
}

.art-card:hover, .art-card.active {
  background: var(--hov);
  border-color: var(--fbrd);
}

.art-card-left {
  display: flex;
  align-items: center;
  gap: 12px;
  overflow: hidden;
}

.art-icon {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--bg);
  border: 1px solid var(--brd);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--sub);
  flex-shrink: 0;
}

.art-meta {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.art-title {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--txt);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.art-ext {
  font-size: 11.5px;
  color: var(--sub);
  text-transform: uppercase;
  margin-top: 2px;
}

.art-dl-mini {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  border: 1px solid var(--brd);
  background: transparent;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.art-dl-mini:hover {
  background: var(--bg);
  color: var(--txt);
}

/* Правая панель просмотра артефактов с регулировкой ширины */
.art-pane {
  position: relative;
  width: 0;
  opacity: 0;
  overflow: hidden;
  background: var(--art-bg);
  border-left: 1px solid var(--brd);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
}

.art-pane.no-trans {
  transition: none !important;
}

.art-pane.open {
  opacity: 1;
}

.art-resizer {
  position: absolute;
  top: 0;
  left: -4px;
  width: 9px;
  height: 100%;
  cursor: col-resize;
  z-index: 110;
}

.art-resizer:hover::after,
body.resizing .art-resizer::after {
  content: "";
  position: absolute;
  top: 0;
  left: 4px;
  width: 2px;
  height: 100%;
  background: var(--fbrd);
}

.art-nav {
  height: 48px;
  padding: 0 14px;
  border-bottom: 1px solid var(--brd);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--sb);
  flex-shrink: 0;
}

.art-nav-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--txt);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.art-nav-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.art-tabs {
  display: flex;
  background: var(--inp);
  border: 1px solid var(--brd);
  border-radius: 7px;
  padding: 2px;
}

.art-tab {
  padding: 3px 9px;
  font-size: 12px;
  border: none;
  background: transparent;
  color: var(--sub);
  border-radius: 5px;
  cursor: pointer;
}

.art-tab.active {
  background: var(--hov);
  color: var(--txt);
  font-weight: 500;
}

.nav-icon-btn {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
}

.nav-icon-btn:hover {
  background: var(--hov);
  color: var(--txt);
}

.art-body {
  flex: 1;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  width: 100%;
}

/* Текст и код всегда переносятся по ширине без горизонтального ползунка */
.art-code-view {
  padding: 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.6;
  color: var(--txt);
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  overflow-x: hidden;
  width: 100%;
  min-height: 100%;
}

.art-preview-frame {
  width: 100%;
  height: 100%;
  border: none;
  background: #FFFFFF;
  display: block;
}

/* Поле ввода */
.pbox {
  width: 100%;
  background: var(--inp);
  border: 1px solid var(--brd);
  border-radius: 16px;
  padding: 14px 14px 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.2s ease, background 0.2s ease;
}

.pbox:focus-within { border-color: var(--fbrd); }

.main.started .pbox {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  padding: 8px 10px;
  border-radius: 14px;
  gap: 8px;
}

.files {
  display: none;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
}

.files.show { display: flex; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--hov);
  border: 1px solid var(--brd);
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 8px;
}

.chip button {
  background: none;
  border: none;
  color: var(--sub);
  cursor: pointer;
  font-size: 14px;
}

textarea {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--txt);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  resize: none;
  min-height: 44px;
  max-height: 200px;
}

.main.started textarea {
  flex: 1;
  width: auto;
  min-height: 24px;
  max-height: 140px;
  order: 2;
  padding: 4px 2px;
}

textarea::placeholder { color: var(--sub); }

.pbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}

.main.started .pbar { display: contents; }

.att-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: transparent;
  border: none;
  color: var(--sub);
  font-size: 22px;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.main.started .att-btn { order: 1; }
.att-btn:hover { background: var(--hov); color: var(--txt); }

.snd-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--sbg);
  border: none;
  color: var(--scol);
  font-size: 18px;
  font-weight: 600;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding-top: 4px;
  flex-shrink: 0;
  margin-left: auto;
}

.snd-btn.vis { display: flex; }
.snd-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.main.started .snd-btn { order: 3; margin-left: 0; }

@media (max-width: 820px) {
  .art-pane.open {
    position: fixed;
    inset: 0;
    width: 100% !important;
    z-index: 120;
  }
}
</style>
</head>
<body>

<div class="trig" id="trig">l l</div>

<!-- Иконка в правом верхнем углу (появляется после закрытия артефакта) -->
<button type="button" class="art-trig" id="artTrig" title="Открыть панель артефакта">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <rect x="1.5" y="2" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/>
    <path d="M8 2H12.5C13.6046 2 14.5 2.89543 14.5 4V12C14.5 13.1046 13.6046 14 12.5 14H8V2Z" fill="currentColor"/>
  </svg>
</button>

<aside class="sb" id="sb">
  <div class="resizer" id="resizer"></div>
  <div class="sb-head"><span class="brand">Ксенон</span></div>
  <button class="new-btn" id="newBtn"><span>+</span><span>Новый чат</span></button>
  
  <div class="ad-box" id="adSlot">Контекстная реклама<br>(Zero-Data)</div>

  <div class="sb-foot">
    <button class="thm-btn" id="thmBtn" title="Сменить тему">
      <svg id="iSun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <svg id="iMoon" viewBox="0 0 24 24" style="display:none">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </button>
  </div>
</aside>

<div class="workspace" id="workspace">
  <main class="main" id="main">
    <div class="wrap">
      <div class="greet" id="greetBox">
        <span class="plus-neon">+</span>
        <h1 class="greet-txt" id="greetTxt"></h1>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="pbox">
        <div class="files" id="filesBox"></div>
        <textarea id="inp" placeholder="Чем я могу помочь сегодня?" rows="1"></textarea>
        <div class="pbar">
          <input type="file" id="fInp" multiple hidden>
          <button type="button" class="att-btn" id="attBtn">+</button>
          <button type="button" class="snd-btn" id="sndBtn">^</button>
        </div>
      </div>
    </div>
  </main>

  <section class="art-pane" id="artPane">
    <div class="art-resizer" id="artResizer"></div>
    <div class="art-nav">
      <div class="art-nav-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span id="artPaneName">document.txt</span>
      </div>
      <div class="art-nav-actions">
        <div class="art-tabs" id="artTabs">
          <button type="button" class="art-tab active" id="tabPreview">Превью</button>
          <button type="button" class="art-tab" id="tabCode">Код</button>
        </div>
        <button type="button" class="nav-icon-btn" id="btnCopyArt" title="Копировать">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button type="button" class="nav-icon-btn" id="btnDlArt" title="Скачать файл">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button type="button" class="nav-icon-btn" id="btnCloseArt" title="Свернуть панель">✕</button>
      </div>
    </div>
    <div class="art-body" id="artBody"></div>
  </section>
</div>

<script>
const dot = String.fromCharCode(46);
const GIST_RAW_URL = `https://gist${dot}githubusercontent${dot}com/anwpf3-cmyk/c37340f36d1436d0910963fafe12e98f/raw/api_url${dot}json`;

const SYSTEM_PROMPT = `Ты Ксенон — точный и лаконичный ИИ-ассистент. Отвечай на языке пользователя.
Если пользователь задаёт обычный вопрос или здоровается — отвечай кратко и по делу обычным текстом.
ТОЛЬКО если пользователь явно просит написать программу, веб-страницу, скрипт, игру или большой документ, оформи результат в виде блока кода с указанием имени файла после двоеточия:
\`\`\`file:index.html
...полный код...
\`\`\`
Не используй формат file:... в обычных ответах.`;

let chatHistory = [];
let artifacts = [];
let currentArtifact = null;
let currentMode = 'preview';
let isGenerating = false;

const G = {
  0: ["Полночь открывает чистый лист для идей.", "С новым днем и ясными мыслями!", "В звездной тишине так легко сосредоточиться."],

const setG = () => {
  const h = new Date().getHours();
  const a = G[h] || G[12];
  document.getElementById('greetTxt').textContent = a[Math.floor(Math.random() * a.length)];
};
setG();

// Тема
const thmBtn = document.getElementById('thmBtn');
const iSun = document.getElementById('iSun');
const iMoon = document.getElementById('iMoon');
const setThm = l => {
  document.body.classList.toggle('light', l);
  iSun.style.display = l ? 'none' : 'block';
  iMoon.style.display = l ? 'block' : 'none';
};
if (localStorage.getItem('x_thm') === 'light') setThm(true);
thmBtn.onclick = () => {
  const l = !document.body.classList.contains('light');
  setThm(l);
  localStorage.setItem('x_thm', l ? 'light' : 'dark');
};

// Левая панель
const sb = document.getElementById('sb');
const trig = document.getElementById('trig');
const workspace = document.getElementById('workspace');
const main = document.getElementById('main');
const resizer = document.getElementById('resizer');

let pin = false;
let isResizingSb = false;
let sbPct = parseFloat(localStorage.getItem('x_sb_pct')) || 15;

function applySbWidth() {
  sbPct = Math.min(20, Math.max(10, sbPct));
  const px = Math.round(window.innerWidth * (sbPct / 100));
  sb.style.width = px + 'px';
  workspace.style.marginLeft = (pin && window.innerWidth > 640) ? (px + 'px') : '0px';
}

applySbWidth();
window.addEventListener('resize', applySbWidth);

trig.onmouseenter = () => sb.classList.add('open');
sb.onmouseleave = () => { if (!pin && !isResizingSb) sb.classList.remove('open'); };

function closePinnedSidebar() {
  pin = false;
  sb.classList.remove('open');
  trig.classList.remove('pin');
  document.body.classList.remove('pinned');
  workspace.style.marginLeft = '0px';
}

trig.onclick = () => {
  if (pin) {
    closePinnedSidebar();
  } else {
    pin = true;
    sb.classList.add('open');
    trig.classList.add('pin');
    document.body.classList.add('pinned');
    applySbWidth();
  }
};

resizer.addEventListener('mousedown', (e) => {
  if (!pin) return;
  e.preventDefault();
  isResizingSb = true;
  document.body.classList.add('resizing');
  sb.classList.add('no-trans');
  workspace.classList.add('no-trans');
});

// === УПРАВЛЕНИЕ АРТЕФАКТАМИ И РЕГУЛИРОВКА ИХ ШИРИНЫ ===
const artPane = document.getElementById('artPane');
const artResizer = document.getElementById('artResizer');
const artTrig = document.getElementById('artTrig');
const artPaneName = document.getElementById('artPaneName');
const artBody = document.getElementById('artBody');
const artTabs = document.getElementById('artTabs');
const tabPreview = document.getElementById('tabPreview');
const tabCode = document.getElementById('tabCode');

let isResizingArt = false;
let artPct = parseFloat(localStorage.getItem('x_art_pct')) || 48;

function applyArtWidth() {
  if (!artPane.classList.contains('open')) {
    artPane.style.width = '0px';
    return;
  }
  if (window.innerWidth <= 820) {
    artPane.style.width = '100%';
    return;
  }
  artPct = Math.min(72, Math.max(26, artPct));
  artPane.style.width = artPct + '%';
}

window.addEventListener('resize', applyArtWidth);

artResizer.addEventListener('mousedown', (e) => {
  if (!artPane.classList.contains('open')) return;
  e.preventDefault();
  isResizingArt = true;
  document.body.classList.add('resizing');
  artPane.classList.add('no-trans');
});

window.addEventListener('mousemove', (e) => {
  if (isResizingSb) {
    const rawPct = (e.clientX / window.innerWidth) * 100;
    if (rawPct < 5) {
      isResizingSb = false;
      document.body.classList.remove('resizing');
      sb.classList.remove('no-trans');
      workspace.classList.remove('no-trans');
      closePinnedSidebar();
      return;
    }
    sbPct = Math.min(20, Math.max(10, rawPct));
    localStorage.setItem('x_sb_pct', sbPct.toFixed(2));
    applySbWidth();
  }

  if (isResizingArt) {
    const wsRect = workspace.getBoundingClientRect();
    const rightWidth = wsRect.right - e.clientX;
    const rawArtPct = (rightWidth / wsRect.width) * 100;
    artPct = Math.min(72, Math.max(26, rawArtPct));
    localStorage.setItem('x_art_pct', artPct.toFixed(2));
    applyArtWidth();
  }
});

window.addEventListener('mouseup', () => {
  if (isResizingSb) {
    isResizingSb = false;
    document.body.classList.remove('resizing');
    sb.classList.remove('no-trans');
    workspace.classList.remove('no-trans');
  }
  if (isResizingArt) {
    isResizingArt = false;
    document.body.classList.remove('resizing');
    artPane.classList.remove('no-trans');
  }
});

function downloadArtifact(art) {
  const blob = new Blob([art.content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = art.filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function renderArtifactPane() {
  if (!currentArtifact) return;
  artPaneName.textContent = currentArtifact.filename;
  const isHtml = /\.(html|htm|svg)$/i.test(currentArtifact.filename);

  artTabs.style.display = isHtml ? 'flex' : 'none';
  if (!isHtml) currentMode = 'code';

  tabPreview.classList.toggle('active', currentMode === 'preview');
  tabCode.classList.toggle('active', currentMode === 'code');

  artBody.innerHTML = '';
  if (isHtml && currentMode === 'preview') {
    const iframe = document.createElement('iframe');
    iframe.className = 'art-preview-frame';
    iframe.setAttribute('sandbox', 'allow-scripts');
    iframe.srcdoc = currentArtifact.content;
    artBody.appendChild(iframe);
  } else {
    const pre = document.createElement('div');
    pre.className = 'art-code-view';
    pre.textContent = currentArtifact.content;
    artBody.appendChild(pre);
  }
}

function openArtifact(art, autoPreview = true) {
  if (!art) return;
  currentArtifact = art;
  if (autoPreview) {
    currentMode = /\.(html|htm|svg)$/i.test(art.filename) ? 'preview' : 'code';
  }
  artPane.classList.add('open');
  artTrig.classList.remove('vis');
  applyArtWidth();
  document.querySelectorAll('.art-card').forEach(el => {
    el.classList.toggle('active', el.dataset.id === art.id);
  });
  renderArtifactPane();
}

function closeArtifactPane() {
  artPane.classList.remove('open');
  artPane.style.width = '0px';
  document.querySelectorAll('.art-card').forEach(el => el.classList.remove('active'));
  if (currentArtifact || artifacts.length > 0) {
    artTrig.classList.add('vis');
  }
}

tabPreview.onclick = () => { currentMode = 'preview'; renderArtifactPane(); };
tabCode.onclick = () => { currentMode = 'code'; renderArtifactPane(); };
document.getElementById('btnCloseArt').onclick = closeArtifactPane;
artTrig.onclick = () => {
  const target = currentArtifact || artifacts[artifacts.length - 1];
  if (target) openArtifact(target, true);
};

document.getElementById('btnDlArt').onclick = () => { if (currentArtifact) downloadArtifact(currentArtifact); };
document.getElementById('btnCopyArt').onclick = () => {
  if (!currentArtifact) return;
  navigator.clipboard.writeText(currentArtifact.content);
  const btn = document.getElementById('btnCopyArt');
  btn.style.color = '#4ade80';
  setTimeout(() => btn.style.color = '', 1000);
};

// === ПРИКРЕПЛЕНИЕ ФАЙЛОВ И ВВОД ===
const inp = document.getElementById('inp');
const sndBtn = document.getElementById('sndBtn');
const attBtn = document.getElementById('attBtn');
const fInp = document.getElementById('fInp');
const filesBox = document.getElementById('filesBox');
let files = [];

const updBtn = () => sndBtn.classList.toggle('vis', inp.value.trim().length > 0 || files.length > 0);
attBtn.onclick = () => fInp.click();
fInp.onchange = e => {
  files = files.concat(Array.from(e.target.files));
  renderF();
  updBtn();
  fInp.value = '';
};

function renderF() {
  filesBox.innerHTML = '';
  filesBox.classList.toggle('show', files.length > 0);
  files.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'chip';
    d.innerHTML = `<span>${f.name}</span><button type="button">&times;</button>`;
    d.querySelector('button').onclick = () => {
      files.splice(i, 1);
      renderF();
      updBtn();
    };
    filesBox.appendChild(d);
  });
}

inp.oninput = function() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
  updBtn();
};

// === ОЧИСТКА МЫСЛЕЙ (THINKING PROCESS) И РЕНДЕР ОТВЕТА ===
const msgs = document.getElementById('msgs');
const greetBox = document.getElementById('greetBox');

function stripThinking(raw) {
  let text = raw.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
  if (/<think>/i.test(raw) && !/<\/think>/i.test(raw)) {
    return { clean: '', isThinking: true };
  }
  if (/^Thinking Process:/i.test(text)) {
    const finalMatch = text.match(/(?:Final choice:|Final Answer:|Финальный ответ:|Ответ:)\s*([\s\S]*)$/i);
    if (finalMatch) {
      text = finalMatch[1].trim();
    } else {
      return { clean: '', isThinking: true };
    }
  }
  return { clean: text, isThinking: false };
}

function renderAiContent(container, rawText, artObj) {
  const { clean, isThinking } = stripThinking(rawText);

  if (isThinking && !clean) {
    container.innerHTML = '<span class="thinking-pulse">Думаю...</span>';
    return;
  }

  const fileMatch = clean.match(/```file:([^

`]+)
?
([\s\S]*?)(?:```|$)/);
  if (!fileMatch) {
    container.textContent = clean;
    return;
  }

  const filename = fileMatch[1].trim();
  const codeContent = fileMatch[2].replace(/^
+|
+$/g, '');

  artObj.filename = filename;
  artObj.title = filename;
  artObj.content = codeContent;

  const beforeText = clean.slice(0, fileMatch.index).trim();
  const afterIdx = fileMatch.index + fileMatch[0].length;
  const afterText = clean.slice(fileMatch.index).includes('```', 7) ? clean.slice(afterIdx).trim() : '';

  container.innerHTML = '';
  if (beforeText) {
    const p1 = document.createElement('div');
    p1.textContent = beforeText;
    container.appendChild(p1);
  }

  const ext = artObj.filename.split('.').pop() || 'FILE';
  const card = document.createElement('div');
  card.className = 'art-card active';
  card.dataset.id = artObj.id;
  card.innerHTML = `
    <div class="art-card-left">
      <div class="art-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <div class="art-meta">
        <div class="art-title">${artObj.filename}</div>
        <div class="art-ext">${ext} · Открыть</div>
      </div>
    </div>
    <button type="button" class="art-dl-mini" title="Скачать">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  `;

  card.onclick = (e) => {
    if (e.target.closest('.art-dl-mini')) {
      e.stopPropagation();
      downloadArtifact(artObj);
      return;
    }
    openArtifact(artObj, true);
  };

  container.appendChild(card);

  if (afterText) {
    const p2 = document.createElement('div');
    p2.style.marginTop = '8px';
    p2.textContent = afterText;
    container.appendChild(p2);
  }

  openArtifact(artObj, false);
}

async function readAttachedFiles(fileList) {
  let attachedText = '';
  for (const f of fileList) {
    try {
      const txt = await f.text();
      attachedText += `

--- Файл: ${f.name} ---
${txt.slice(0, 15000)}`;
    } catch (e) {}
  }
  return attachedText;
}

async function send() {
  if (isGenerating) return;
  const t = inp.value.trim();
  if (!t && !files.length) return;

  isGenerating = true;
  sndBtn.disabled = true;

  greetBox.style.display = 'none';
  msgs.classList.add('active');
  main.classList.add('started');

  const attachedContent = await readAttachedFiles(files);
  const displayUserText = t + (files.length ? `
[Прикреплено: ${files.map(f => f.name).join(', ')}]` : '');
  const fullPromptForAi = (t || 'Проанализируй прикреплённые файлы.') + attachedContent;

  const u = document.createElement('div');
  u.className = 'msg user';
  u.textContent = displayUserText;
  msgs.appendChild(u);

  const aiDiv = document.createElement('div');
  aiDiv.className = 'msg ai';
  aiDiv.innerHTML = '<span class="thinking-pulse">Подключение...</span>';
  msgs.appendChild(aiDiv);
  msgs.scrollTop = msgs.scrollHeight;

  inp.value = '';
  inp.style.height = 'auto';
  files = [];
  renderF();
  updBtn();

  const artObj = { id: 'art_' + Date.now(), filename: 'code.txt', title: 'Артефакт', content: '' };

  try {
    const gistRes = await fetch(`${GIST_RAW_URL}?t=${Date.now()}`);
    const gistData = await gistRes.json();
    if (!gistData.url) throw new Error('Сервер Kaggle сейчас не запущен.');

    const response = await fetch(`${gistData.url}/v1/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...chatHistory,
          { role: 'user', content: fullPromptForAi }
        ],
        temperature: 0.7,
        max_tokens: 4096,
        stream: true
      })
    });

    if (!response.ok) throw new Error(`Ошибка сервера (${response.status})`);

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let fullResponse = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('
');

      for (const line of lines) {
        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
          try {
            const json = JSON.parse(line.slice(6));
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              fullResponse += delta;
              renderAiContent(aiDiv, fullResponse, artObj);
              msgs.scrollTop = msgs.scrollHeight;
            }
          } catch (e) {}
        }
      }
    }

    const { clean: finalClean } = stripThinking(fullResponse);
    if (!finalClean) {
      aiDiv.textContent = fullResponse.replace(/<think>|<\/think>/gi, '').trim();
    }

    if (artObj.content) {
      artifacts.push(artObj);
      openArtifact(artObj, true);
    }

    chatHistory.push({ role: 'user', content: fullPromptForAi });
    chatHistory.push({ role: 'assistant', content: finalClean || fullResponse });

  } catch (err) {
    aiDiv.textContent = 'Не удалось подключиться к Ксенону: сервер в Kaggle сейчас спит или перезагружается.';
  } finally {
    isGenerating = false;
    sndBtn.disabled = false;
  }
}

sndBtn.onclick = send;
inp.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
};

document.getElementById('newBtn').onclick = () => {
  chatHistory = [];
  artifacts = [];
  currentArtifact = null;
  artPane.classList.remove('open');
  artPane.style.width = '0px';
  artTrig.classList.remove('vis');
  msgs.innerHTML = '';
  msgs.classList.remove('active');
  main.classList.remove('started');
  greetBox.style.display = 'flex';
  inp.value = '';
  inp.style.height = 'auto';
  files = [];
  renderF();
  updBtn();
  setG();
};
